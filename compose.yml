name: app

services:
  backend:
    build:
      dockerfile: ./docker/backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - database:/database
    depends_on:
      - database
    environment:
      APP_NAME : ${APP_NAME}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DRIVER: ${DB_DRIVER}
      HIBERNATE_DIALECT: ${HIBERNATE_DIALECT}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO}
      HIBERNATE_SHOW_SQL: ${HIBERNATE_SHOW_SQL}
  database:
    build:
      dockerfile: ./docker/database/Dockerfile
    volumes:
      - database:/database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
volumes:
  database: